name: Publicar Sinteria Automatizaciones

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v6
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar la web
        run: |
          mkdir -p "$RUNNER_TEMP/sinteria-pages"
          rsync -a --exclude=/.git/ --exclude=/.github/ --exclude=/inventarios/ ./ "$RUNNER_TEMP/sinteria-pages/"
      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/sinteria-pages
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
