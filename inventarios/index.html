  <style>

function location(id) {
  const item = byId('l',id);
  if (!item) return null;
  const sub = byId('s',item.parent), warehouse = byId('w',sub.parent);
  return { id:item.id, item, sub, warehouse, text:[warehouse.name,sub.name,item.name].join(' / ') };
}

function balances(id) {
  return data.b.filter(item => item.product === id);
}

function classify(product, stock) {
  if (!product.active) return 'INACTIVO';
  return stock === 0 ? 'QUIEBRE DE STOCK' : stock <= product.min ? 'STOCK BAJO' : stock > product.max ? 'EXCESO DE STOCK' : 'NORMAL';
}

function productCell(product) {

}

function pathCell(loc) {

}

function matchesProduct(product, search) {
  const find = fold(search).trim();
  return !find || [product.id,product.code,product.name,product.description].some(value => fold(value).includes(find));
}

function unique(values) {
  return [...new Set(values)].sort((a,b) => String(a).localeCompare(String(b),'es'));
}

function categories() {
  return unique(data.p.map(product => product.category)).map(name => [name,name]);
}

function stockRows(filter = {}, alerts = false) {
  return data.p.filter(product => matchesProduct(product,filter.q) && (!filter.category || product.category === filter.category) && (!filter.id || product.id === filter.id))
    .flatMap(product => {
      const all = balances(product.id);
      const total = quantSum(all);
      const scoped = filter.wh ? all.filter(item => location(item.loc)?.warehouse.id === filter.wh) : all;
      const scope = quantSum(scoped);
      const state = classify(product,scope);
      if (filter.wh && !scoped.length || alerts && (state === 'NORMAL' || state === 'INACTIVO') ||
          filter.state === 'reponer' && !['STOCK BAJO','QUIEBRE DE STOCK'].includes(state) ||
          filter.state && filter.state !== 'reponer' && state !== filter.state) return [];
      const context = { product, total, scope, state };
      if (alerts) return [context];
      if (!scoped.length) return !filter.loc && !filter.place ? [{ ...context, loc:null, qty:0 }] : [];
      return scoped.map(item => ({ ...context, loc:location(item.loc), qty:item.qty })).filter(item =>
        (!filter.loc || item.loc?.id === filter.loc) && (!filter.place || fold(item.loc?.text).includes(fold(filter.place).trim())));
    });
}


function metric(title, value, text, icon, tone = '', status = '') {

  <div class="metric-value ${String(value).length > 16 ? 'text' : ''}">${escape(value)}</div><div class="metric-caption">${escape(text)}</div>`;
  return status ? `<button type="button" class="metric" data-action="alert-filter" data-value="${escape(status)}">${body}</button>` : `<div class="metric">${body}</div>`;
}

    <div><strong>${escape(product.name)}</strong><small>${escape(product.code)} · ${qty(total)} ${escape(product.unit)}</small></div>${badge(state)}</li>`).join('')}</ul>`;
}

function bars(rows, emptyText) {
  if (!rows.length) return empty('Sin datos en el período',emptyText);
  const max = Math.max(...rows.map(row => row.value),1);
  return `<div class="warehouse-bars">${rows.map(row => `<div class="bar-item">
  <div class="bar-title"><strong>${escape(row.label)}</strong><span>${escape(row.quantity)}</span></div>
  <div class="bar-track" aria-hidden="true"><div class="bar-fill" style="width:${Math.min(100,row.value / max * 100)}%"></div></div>
  ${row.detail ? `<small class="caption">${escape(row.detail)}</small>` : ''}</div>`).join('')}</div>`;
}

function warehouseBars() {
  return bars(data.w.map(warehouse => {
    const available = data.b.filter(row => row.qty > 0 && location(row.loc)?.warehouse.id === warehouse.id);
    const unitGroups = new Map();
    available.forEach(row => {
      const unit = getProduct(row.product)?.unit || 'UND';
      unitGroups.set(unit,(unitGroups.get(unit) || 0) + mill(row.qty));
    });
    const value = new Set(available.map(row => row.product)).size;
    return {label:warehouse.name,value,quantity:value + (value === 1 ? ' producto' : ' productos'),
      detail:[...unitGroups].map(([unit,sum]) => qty(sum / 1000) + ' ' + unit).join(' · ')};
  }), 'Crea un almacén para consultar existencias por sede.');
}

function period() {
  const today = data.today;
  if (ui.range === 'custom') return [ui.dates.from || today,ui.dates.to || today];
  if (ui.range === 'month') return [today.slice(0,8) + '01',today];
  if (ui.range === 'last7') return [new Date(Date.parse(today + 'T00:00:00Z') - 6 * 86400000).toISOString().slice(0,10),today];
  return [today,today];
}

function dashboard() {
  const alerts = stockRows({},true);
  const severity = ['QUIEBRE DE STOCK','STOCK BAJO','EXCESO DE STOCK'];
  alerts.sort((a,b) => severity.indexOf(a.state) - severity.indexOf(b.state));
  const count = status => alerts.filter(row => row.state === status).length;
  const low = metric('Stock bajo',count('STOCK BAJO'),'Productos en el mínimo o por debajo','alert','bajo','STOCK BAJO');
  const emptyStock = metric('Agotados',count('QUIEBRE DE STOCK'),'Productos con saldo cero','box','quiebre','QUIEBRE DE STOCK');
  const salesMode = data.mode === 'ventas';
  const shortcuts = salesMode ? button('Nueva venta','form','plus','primary','sale') :
    button('Registrar entrada','form','entry','primary','entry') + button('Registrar salida','form','exit','secondary','exit');
  let summary;
  if (salesMode) {
    const [from,to] = period();
    const sales = data.v.filter(sale => within(sale.stamp,from,to));
    const saleIds = new Set(sales.map(sale => sale.id));
    const sums = new Map();
    data.d.filter(row => saleIds.has(row.id)).forEach(row => {
      const item = sums.get(row.product) || { label:getProduct(row.product)?.name || row.name, value:0 };
      item.value += mill(row.qty);
      sums.set(row.product,item);
    });
    const ranking = [...sums.values()].sort((a,b) => b.value - a.value || a.label.localeCompare(b.label,'es'));
    const soldQty = value => qty(value / 1000) + (value === 1000 ? ' vendida' : ' vendidas');
    const toBars = rows => rows.map(row => ({ ...row, quantity:soldQty(row.value) }));
    const controls = `<div class="periods"><div class="pills" aria-label="Período">
      ${[['today','Hoy'],['last7','Últimos 7 días'],['month','Mes actual'],['custom','Personalizado']].map(([key,label]) =>
        `<button type="button" class="period-button" data-action="period" data-value="${key}" aria-pressed="${ui.range === key}">${label}</button>`).join('')}</div>
      ${ui.range === 'custom' ? field('Desde',input('from',from,'type="date" data-period')) + field('Hasta',input('to',to,'type="date" data-period')) : ''}
      <span class="caption">${dateFmt(from)}${from === to ? '' : ' – ' + dateFmt(to)}</span></div>`;
    summary = `${controls}${from > to ? '<p class="notice warn">La fecha inicial debe ser anterior o igual a la fecha final.</p>' : ''}
      <div class="metrics sales-metrics">
      ${metric('Ventas registradas',sales.length,ui.range === 'today' ? 'Operaciones de hoy' : 'Operaciones del período','cart')}
      ${metric('Importe vendido',money(sales.reduce((sum,row) => sum + cents(row.total),0) / 100),'Total del período','layers')}
      ${metric('Unidades vendidas',qty(quantSum(sales)),'Cantidades en las ventas del período','box')}
      ${metric('Producto más vendido',ranking[0]?.label || '—',ranking.length ? soldQty(ranking[0].value) : 'Registra una venta para ver el resultado','grid')}
      ${emptyStock}${low}</div>
      <div class="grid-two">
      ${panel('Productos más vendidos',bars(toBars(ranking.slice(0,4)), 'Registra una venta para obtener la clasificación.'))}
      ${panel('Menor rotación entre productos vendidos',bars(toBars(ranking.slice().reverse().slice(0,4)), 'Registra una venta para obtener la clasificación.'))}</div>
      ${panel('Ventas recientes',salesTable(sales.slice().reverse().slice(0,5),true),button('Historial','nav','arrow','ghost small','sales'))}`;
  } else {
    summary = `<div class="metrics">${low}${emptyStock}
      ${metric('Exceso de stock',count('EXCESO DE STOCK'),'Productos sobre el máximo','layers','exceso','EXCESO DE STOCK')}
      ${metric('Por reponer',count('STOCK BAJO') + count('QUIEBRE DE STOCK'),'Saldos bajos y productos agotados','transfer','','reponer')}
      </div><div class="grid-two">
      ${panel('Stock disponible por almacén',warehouseBars(),button('Consultar','nav','arrow','ghost small','stock'))}
      ${panel('Alertas de inventario',alertList(alerts),button('Ver todas','nav','arrow','ghost small','alerts'))}</div>
      ${panel('Últimos movimientos',movementTable(data.k.slice().reverse().slice(0,6),true),button('Ver Kardex','nav','arrow','ghost small','ledger'))}`;
  }
  return `${head('Panel de control', 'Consulta el estado de tus existencias y las operaciones de la sesión.',shortcuts,'Administrador Demo')}
  <div class="dash-banner"><div><span class="eyebrow">MODALIDAD ACTIVA</span><h2>${modeName()}</h2>
  <p>Entorno de prueba con datos ficticios y sesión individual.</p></div>${button('Cambiar modalidad','choose','transfer')}</div>
  ${summary}<div class="dash-banner" style="margin:1rem 0 0"><div><h2>¿Necesitas un sistema personalizado?</h2><p>Conoce las opciones para tu negocio.</p></div>
  ${button('Conocer más','nav','arrow','secondary','help')}</div>`;
}

function productsTable() {
  const f = getFilter();
  const products = data.p.filter(p => matchesProduct(p,f.q) && (!f.category || f.category === p.category) &&
    (!f.active || (f.active === 'active') === p.active));
  const rows = products.map(p => [
    productCell(p), idText(p.id), escape(p.unit), priceCell(p.price), numeric(quantSum(balances(p.id))),
    cell(qty(p.min) + ' / ' + qty(p.max),'num'), p.active ? '<span class="pill normal">ACTIVO</span>' : badge('INACTIVO'),
    cell(`${button('Detalle','product-view','search','ghost small',p.id)}${button('Editar','product-edit','edit','secondary small',p.id)}`,'nowrap')
  ]);
  return table(['Producto','ID MASTER','U.M.','#Precio','#Stock total','#Mín. / máx.','Estado','Acciones'],rows,
    'No encontramos productos','Revisa el código o limpia los filtros.','Catálogo de productos') + caption(products.length + ' productos encontrados.');
}

function stockPage(alerts) {
  const f = getFilter();
  const stockFilters = alerts ? '' : filterInput('place','Buscar ubicación','type="search" placeholder="Zona, estante o nivel"');
  const states = Object.keys(STATUS).filter(state => !alerts || !['NORMAL','INACTIVO'].includes(state)).map(state => [state,state]);
  return `${head(alerts ? 'Alertas de inventario' : 'Stock real',
    alerts ? 'Identifica productos agotados, por reponer o por encima de su máximo.' : 'Consulta el saldo por ubicación y el total de cada producto en todos los almacenes.',
    excel(alerts ? 'alerts' : 'stock'))}
  <section class="panel">${filterBar(filterInput('q','Buscar producto','type="search" placeholder="Código, ID MASTER o nombre"','search') + stockFilters +
  filterSelect('wh','Almacén',[['','Todos los almacenes'],...data.w.map(item => [item.id,item.name])]) +
  filterSelect('category','Categoría',[['','Todas las categorías'],...categories()]) +
  filterSelect('state','Estado de stock',[['','Todos'],['reponer','Por reponer'],...states]))}
  ${f.loc || f.id ? `<p class="table-note">Vista seleccionada · ${escape(f.loc ? location(f.loc)?.text : getProduct(f.id)?.name)}</p>` : ''}
  <div id="results">${stockTable(alerts)}</div></section>`;
}

function stockTable(alerts) {
  const f = getFilter();
  const result = stockRows(f,alerts);
  const rows = result.map(row => {
    const {product,loc,state,total,scope} = row;
    const lead = [productCell(product),idText(product.id)];
    const end = [numeric(product.min),numeric(product.max),badge(state),
      button('Ver producto','product-view','search','ghost small',product.id)];
    return alerts ? [...lead,numeric(scope),...(f.wh ? [numeric(total)] : []),...end] :
      [...lead,pathCell(loc),cell(qty(row.qty) + ' ' + escape(product.unit),'num'),numeric(total),...end];
  });
  const headers = alerts ? ['Producto','ID MASTER','#Saldo',...(f.wh ? ['#Total general'] : [])] :
    ['Producto','ID MASTER','Ubicación exacta','#Stock ubicación','#Total general'];
  return table([...headers,'#Mín.','#Máx.','Estado','Detalle'],rows,'Sin coincidencias','Prueba con otros filtros.','Consulta de stock') +
    caption(result.length + ' resultados · El estado se calcula con el saldo ' + (f.wh ? 'del almacén seleccionado.' : 'total del producto.'));
}

const movementViews = {
  ledger:['Kardex e historial','Consulta la trazabilidad completa por producto y ubicación.','',null,'ledger'],
  entries:['Entradas','Registra reposiciones e ingresos y consulta sus documentos.','Registrar entrada','entry','entries'],
  exits:['Salidas','Registra consumo, entregas, mermas y devoluciones.','Registrar salida','exit','exits'],
  transfers:['Traslados','Mueve existencias entre ubicaciones y consulta ambos lados del traslado.','Registrar traslado','transfer',null],
  adjustments:['Ajustes de stock','Corrige saldos con un ajuste y conserva el movimiento original en el Kardex.','Registrar ajuste','adjustment',null]
};
const moveTypes = ['ENTRADA','SALIDA','VENTA','TRASLADO SALIDA','TRASLADO ENTRADA','AJUSTE POSITIVO','AJUSTE NEGATIVO'];
const within = (stamp,from,to) => (!from || stamp.slice(0,10) >= from) && (!to || stamp.slice(0,10) <= to);

function availableMovements() {
  const page = ui.page;
  const match = {entries:'ENTRADA',exits:'SALIDA',transfers:'TRASLADO',adjustments:'AJUSTE'}[page];
  return data.k.filter(item => !match || item.type.startsWith(match));
}

function historyFilter(isSales = false) {
  const warehouses = unique([...data.w.map(item => item.name),...data.k.map(item => item.warehouse)]);
  return filterBar(filterInput('from','Fecha inicial','type="date"') + filterInput('to','Fecha final','type="date"') +
    filterInput('q','Código o producto','type="search" placeholder="Código, producto o ID"','search') +
    filterInput('person','Responsable','type="search" placeholder="Alias de prueba"') +
    filterSelect('wh','Almacén',[['','Todos'],...warehouses.map(value => [value,value])]) +
    (ui.page === 'ledger' && !isSales ? filterSelect('type','Tipo de movimiento',[['','Todos'],...moveTypes.map(value => [value,value])]) : ''));
}

function movementsPage() {
  const [title,description,label,form,report] = movementViews[ui.page];
  const actions = (report ? excel(report) : '') + (form ? button(label,'form','plus','primary',form) : '');
  return `${head(title,description,actions,'Operaciones de inventario')}
    <section class="panel">${historyFilter()}<div id="results">${movementResults()}</div></section>`;
}

function movementResults() {
  const f = getFilter();
  const result = availableMovements().filter(item =>
    within(item.stamp,f.from,f.to) && (!f.type || item.type === f.type) && (!f.wh || item.warehouse === f.wh) &&
    fold(item.person).includes(fold(f.person).trim()) && [item.id,item.product,item.code,item.name].some(value => fold(value).includes(fold(f.q).trim()))).reverse();
  return movementTable(result) + caption(result.length + ' movimientos · Fecha y hora de Lima, Perú.');
}

function movementTable(result, brief = false) {
  const kindStyle = {'ENTRADA':'entrada','SALIDA':'salida','VENTA':'venta','AJUSTE POSITIVO':'positivo','AJUSTE NEGATIVO':'negativo'};
  const rows = result.map(item => {
    const type = `<span class="pill ${kindStyle[item.type] || 'traslado'}">${escape(item.type)}</span>`;
    const product = cell(`<strong>${escape(item.name)}</strong><small>${idText(item.code)}</small>`,'name-cell');
    const signed = cell((item.delta > 0 ? '+' : '') + qty(item.delta),'num');
    if (brief) return [timestamp(item.stamp),product,type,signed];
    const route = cell(`<strong>${escape(item.warehouse)}</strong><small>${escape(item.sub)} / ${escape(item.location)}</small>`,'path-cell');
    return [timestamp(item.stamp),product,type,signed,route,escape(item.person),numeric(item.before),numeric(item.after),
      cell(`${idText(item.id)}<small>${escape(item.doc || item.reason || '—')}</small>`,'nowrap'),
      button('Ver','move-view','search','ghost small',[item.id,item.loc,item.product,item.before].join('|'))];
  });
  return table(brief ? ['Fecha y hora','Producto','Tipo','#Cantidad'] :
    ['Fecha y hora','Producto','Tipo','#Cantidad','Ubicación','Responsable','#Anterior','#Posterior','Movimiento / documento','Detalle'],
    rows,'Todavía no hay movimientos','Registra una operación o cambia los filtros.','Historial de movimientos');
}

function salesPage() {
  return `${head('Ventas','Registra ventas y consulta el detalle de cada operación.',excel('sales') + button('Nueva venta','form','plus','primary','sale'),'Ventas + inventario')}
  <section class="panel">${historyFilter(true)}<div id="results">${salesResults()}</div></section>`;
}

function salesResults() {
  const f = getFilter();
  const rows = data.v.filter(item => {
    if (!within(item.stamp,f.from,f.to) || !fold(item.person).includes(fold(f.person).trim())) return false;
    if (!f.q && !f.wh) return true;
    return data.d.some(row => row.id === item.id && (!f.wh || f.wh === row.warehouse) &&
      [item.id,row.product,row.code,row.name].some(value => fold(value).includes(fold(f.q).trim())));
  }).reverse();
  return salesTable(rows) + caption(rows.length + ' ventas · Importes expresados en soles.');
}

function salesTable(rows, brief = false) {
  return table(brief ? ['Fecha y hora','#Unidades','#Total','Detalle'] : ['Fecha y hora','ID venta','Responsable','#Unidades','#Total','Detalle'],
    rows.map(row => [timestamp(row.stamp),...(brief ? [] : [idText(row.id),escape(row.person)]),numeric(row.qty),priceCell(row.total),
      button('Ver venta','sale-view','search','ghost small',row.id)]),
    'Sin ventas en esta vista','Registra una venta con uno o varios productos para ver el resultado.','Historial de ventas');
}

function renderResults() {
  const results = $('#results');
  if (!results) return;
  if (ui.page === 'products') results.innerHTML = productsTable();
  else if (ui.page === 'stock' || ui.page === 'alerts') results.innerHTML = stockTable(ui.page === 'alerts');
  else if (ui.page === 'sales') results.innerHTML = salesResults();
  else results.innerHTML = movementResults();
}


const dialog = $('#modal');
const dialogBody = $('#modal-content');

function modal(title, description, body, options = {}) {
  ui.modal = options;
  dialog.dataset.wide = Boolean(options.wide);
  dialogBody.innerHTML = `<form id="dialog-form"><div class="dialog-head"><div><div class="eyebrow">SINTERIA INVENTARIOS</div>
    <h2 id="dialog-title">${escape(title)}</h2><p class="caption">${escape(description)}</p></div>
    ${button('','modal-close','close','ghost icon-only','','aria-label="Cerrar ventana"')}</div>
    <div class="dialog-body">${body}<div id="modal-error" class="notice error" role="alert" hidden></div></div>
    <div class="dialog-foot">${button(options.kind ? 'Cancelar' : 'Cerrar','modal-close','','secondary')}
    ${options.kind ? `<button class="btn ${options.kind === 'reset' ? 'danger' : 'primary'}" type="submit">${actionIcon(options.kind === 'reset' ? 'refresh' : 'check')}${escape(options.label || 'Guardar cambios')}</button>` : ''}</div></form>`;
  if (!dialog.open) dialog.showModal();
  return $('#dialog-form');
}

function closeModal() {
  if (dialog.open) dialog.close();
  ui.modal = null;
  ui.cart = [];
}

function errorInDialog(message) {
  const node = $('#modal-error');
  if (!node) return;
  node.hidden = !message;
  node.textContent = message || '';
  if (message) node.scrollIntoView({block:'nearest'});
}

function placeForm(level,id,parent) {
  const item = id ? byId(level,id) : null;
  const label = { w:'almacén', s:'subalmacén', l:'ubicación' }[level];
  const parentName = level === 's' ? byId('w',item?.parent || parent)?.name :
    level === 'l' ? byId('s',item?.parent || parent)?.name : '';
  modal(item ? 'Editar ' + label : (level === 'l' ? 'Nueva ' : 'Nuevo ') + label,
    parentName ? 'Dentro de ' + parentName : 'Disponible solo en esta sesión de prueba.',
    field('Nombre',input('name',item?.name,'required maxlength="65"')),
    {kind:'place',level,id:id || '',parent:parent || '',label:item ? 'Guardar nombre' : 'Crear ' + label});
}

function personField() {
  return field('Responsable de operación',input('person','Administrador Demo','required maxlength="55" placeholder="Ej. Operador Demo"') +
    '<small class="caption">Escribe un alias ficticio.</small>');
}

function productOptions(kind, query = '') {
  return data.p.filter(p => matchesProduct(p,query) &&
    (kind === 'exit' || kind === 'adjustment' || p.active) && (kind !== 'sale' || p.price > 0))
    .map(p => [p.id,p.code + ' · ' + p.name]);
}

function routeFields(prefix, title, locName) {
  return `<fieldset class="route"><legend>${escape(title)}</legend><div class="field-grid three">
    ${field('Almacén',select(prefix + 'W',data.w.map(item => [item.id,item.name]),'','data-route="' + prefix + '"'))}
    ${field('Subalmacén',select(prefix + 'S',[],'','data-route="' + prefix + '"'))}
    ${field('Ubicación',select(locName,[],'','data-route="' + prefix + '" required'))}
    </div><p id="available-${prefix}" class="caption"></p></fieldset>`;
}

function selectUpdate(control, items, selected) {
  const choice = items.some(([key]) => key === selected) ? selected : items[0]?.[0] || '';
  control.innerHTML = selectOpts(items.length ? items : [['','Sin opciones disponibles']],choice);
  control.value = choice;
}

function routeUpdate(form,prefix,preferred = null) {
  const warehouse = form.elements[prefix + 'W'];
  const sub = form.elements[prefix + 'S'];
  const loc = form.elements[prefix === 'from' ? 'loc' : 'target'];
  if (!warehouse || !sub || !loc) return;
  if (preferred) warehouse.value = preferred.warehouse.id;
  const subs = data.s.filter(item => item.parent === warehouse.value);
  selectUpdate(sub,subs.map(item => [item.id,item.name]),preferred?.sub.id || sub.value);
  selectUpdate(loc,data.l.filter(item => item.parent === sub.value).map(item => [item.id,item.name]),preferred?.id || loc.value);
  const product = getProduct(form.elements.product.value);
  const balance = product ? balances(product.id).find(item => item.loc === loc.value)?.qty || 0 : 0;
  $('#available-' + prefix).textContent = 'Disponible en esta ubicación · ' + qty(balance) + (product ? ' ' + product.unit : '');
}

function bestLocation(id) {
  return location(balances(id).slice().sort((a,b) => b.qty - a.qty)[0]?.loc);
}

function movementForm(kind) {
  const titles = {entry:'Registrar entrada',exit:'Registrar salida',transfer:'Registrar traslado',adjustment:'Registrar ajuste'};
  const reasons = {
    entry:['Reposición','Compra ficticia','Devolución','Otro'],
    exit:['Consumo interno','Entrega','Merma','Devolución','Otro'],
    transfer:['Reabastecimiento','Reorganización de almacén','Otro']
  };
  const title = titles[kind];
  const f = modal(title,'El sistema genera el ID y la fecha con hora de Lima, Perú.',
    `<div class="field-grid">
    ${field('Buscar producto',input('lookup','','type="search" placeholder="Código, ID MASTER o nombre" data-find-product'))}
    ${field('Producto',select('product',productOptions(kind),'','required data-product'))}
    ${field('Cantidad',input('qty','','type="number" min="0.001" max="99999" step="0.001" required'))}
    ${personField()}
    ${kind === 'adjustment' ? field('Tipo de ajuste',select('direction',[['add','Aumentar stock'],['remove','Descontar stock']])) : ''}
    </div>
    ${routeFields('from',kind === 'entry' ? 'Destino del ingreso' : kind === 'adjustment' ? 'Ubicación del ajuste' : 'Origen','loc')}
    ${kind === 'transfer' ? routeFields('to','Destino del traslado','target') : ''}
    <div class="field-grid">
    ${kind === 'adjustment' ? field('Motivo del ajuste',input('reason','','required maxlength="95" placeholder="Ej. Diferencia del conteo demo"')) :
      field(kind === 'entry' ? 'Motivo del ingreso' : 'Motivo',select('reason',reasons[kind].map(value => [value,value])))}
    ${field('Documento de referencia',input('doc','','maxlength="60" placeholder="Ej. DOC-DEMO-01"'))}
    ${kind === 'adjustment' ? field('ID del movimiento corregido',input('ref','','maxlength="55" placeholder="Opcional"'),'wide') : ''}
    ${field('Observaciones',textarea('notes','','maxlength="200" rows="2"'),'wide')}
    </div>`,{kind,label:title});
  routeUpdate(f,'from',bestLocation(f.elements.product.value));
  if (kind === 'transfer') {
    const other = data.l.find(l => location(l.id).warehouse.id !== f.elements.fromW.value);
    routeUpdate(f,'to',location(other?.id));
  }
}

function saleForm() {
  ui.cart = [];
  const f = modal('Nueva venta','Agrega hasta 12 líneas y confirma la venta completa.',
    `<div class="sale-builder">
    <div class="field-grid three">
    ${field('Buscar producto',input('lookup','','type="search" placeholder="Código o producto" data-find-product'))}
    ${field('Producto',select('product',productOptions('sale'),'','data-product'))}
    ${field('Cantidad',input('cartQty',1,'type="number" min="0.001" max="99999" step="0.001"'))}
    </div><div class="field-grid">
    ${field('Ubicación de salida',select('cartLoc',[]))}
    <div class="actions">${button('Agregar al carrito','cart-add','plus','secondary')}</div>
    </div><p id="sale-price" class="caption"></p></div>
    <div id="cart" class="panel"></div><div id="cart-total" class="cart-total"></div>
    <div class="field-grid">${personField()}${field('Observaciones',input('notes','','maxlength="200"'))}</div>`,
    {kind:'sale',label:'Confirmar venta',wide:true});
  saleLocations(f);
  drawCart();
}

function saleLocations(form) {
  const p = getProduct(form.elements.product.value);
  const choices = p ? balances(p.id).filter(row => row.qty > 0).map(row => [row.loc,location(row.loc).text + ' · ' + qty(row.qty) + ' disponibles']) : [];
  selectUpdate(form.elements.cartLoc,choices,form.elements.cartLoc.value);
  $('#sale-price').textContent = p ? money(p.price) + ' por ' + p.unit + (choices.length ? '' : ' · Producto agotado') : 'Selecciona un producto.';
}

function cartAdd() {
  const f = $('#dialog-form');
  const p = getProduct(f.elements.product.value);
  const loc = f.elements.cartLoc.value;
  const amount = Number(f.elements.cartQty.value);
  if (!p || !loc || !f.elements.cartQty.checkValidity() || !Number.isFinite(amount) || amount < .001) {
    errorInDialog('Selecciona un producto con stock y una cantidad válida.');
    return;
  }
  const existing = ui.cart.find(row => row.product === p.id && row.loc === loc);
  if (!existing && ui.cart.length >= 12) {
    errorInDialog('La demo admite 12 líneas por venta.');
    return;
  }
  const total = mill(amount) + mill(existing?.qty || 0);
  if (total > mill(balances(p.id).find(row => row.loc === loc)?.qty || 0)) {
    errorInDialog('Stock insuficiente. Verifique la cantidad disponible antes de continuar.');
    return;
  }
  if (existing) existing.qty = total / 1000;
  else ui.cart.push({product:p.id,loc,qty:amount,price:p.price});
  errorInDialog('');
  drawCart();
}

const lineCents = row => Math.round(mill(row.qty) * cents(row.price) / 1000);

function drawCart() {
  $('#cart').innerHTML = table(['Producto','Ubicación','#Cantidad','#Precio','#Subtotal','Quitar'],ui.cart.map((row,index) => [
    productCell(getProduct(row.product)),pathCell(location(row.loc)),numeric(row.qty),priceCell(row.price),priceCell(lineCents(row) / 100),
    button('','cart-remove','trash','ghost small icon-only',index,'aria-label="Quitar producto"')
  ]),'Carrito vacío','Agrega un producto para calcular el total.','Detalle de la venta');
  $('#cart-total').innerHTML = `<span>Importe total</span><strong>${money(ui.cart.reduce((sum,row) => sum + lineCents(row),0) / 100)}</strong>`;
  $('#dialog-form button[type=submit]').disabled = !ui.cart.length;
}

function saleView(id) {
  const sale = data.v.find(row => row.id === id);
  if (!sale) return;
  const rows = data.d.filter(row => row.id === id).map(row => [
    cell(`<strong>${escape(row.name)}</strong><small>${idText(row.code)}</small>`,'name-cell'),
    cell(`<strong>${escape(row.warehouse)}</strong><small>${escape(row.sub)} / ${escape(row.location)}</small>`,'path-cell'),
    numeric(row.qty),priceCell(row.price),priceCell(row.total)
  ]);
  modal('Detalle de venta',dateFmt(sale.stamp) + ' · ' + hourFmt(sale.stamp) + ' · ' + sale.person,
    `<p class="caption">${idText(id)}</p><div class="panel">${table(['Producto','Ubicación','#Cantidad','#Precio','#Subtotal'],rows)}</div>
    <div class="cart-total"><span>Total confirmado</span><strong>${money(sale.total)}</strong></div>${sale.notes ? `<p class="caption">${escape(sale.notes)}</p>` : ''}`,
    {wide:true});
}

function moveView(key) {
  const [id,loc,product,before] = key.split('|');
  const row = data.k.find(item => item.id === id && item.loc === loc && item.product === product && String(item.before) === before);
  if (!row) return;
  modal(row.type,dateFmt(row.stamp) + ' · ' + hourFmt(row.stamp) + ' · ' + row.person,
    `<p class="caption">${idText(row.id)}</p><h3>${escape(row.name)} · ${escape(row.code)}</h3>
    <p class="caption">${escape(row.warehouse)} / ${escape(row.sub)} / ${escape(row.location)}</p>
    <p class="notice">Saldo anterior ${qty(row.before)} · Variación ${row.delta > 0 ? '+' : ''}${qty(row.delta)} · Saldo posterior ${qty(row.after)}</p>
    <p class="caption">Motivo · ${escape(row.reason || '—')}<br>Documento · ${escape(row.doc || '—')}
    ${row.ref ? '<br>Movimiento corregido · ' + escape(row.ref) : ''}${row.notes ? '<br>Observaciones · ' + escape(row.notes) : ''}</p>`);
}

function randomId(length) {
  return Array.from(crypto.getRandomValues(new Uint8Array(length)), byte => byte.toString(16).padStart(2,'0')).join('');
}

function remember(value) {
  token = value;
  try {
    if (value) sessionStorage.setItem(STORAGE,value);
    else sessionStorage.removeItem(STORAGE);
  } catch (_) {}
}

function api(action,payload = {}) {
  return new Promise((resolve,reject) => {
    const runner = window.google?.script?.run;
    if (!runner) {
      reject(new Error('Abre la aplicación desde su enlace de Google Apps Script.'));
      return;
    }
    runner.withSuccessHandler(result => {
      if (result?.ok) resolve(result.data);
      else {
        const error = new Error(result?.message || 'La demo no pudo atender la solicitud.');
        error.code = result?.code;
        reject(error);
      }
    }).withFailureHandler(() => reject(new Error('La conexión se interrumpió. Intenta de nuevo.'))).rpc(action,token,payload);
  });
}

async function submitOperation(payload) {
  const full = { ...payload,epoch:data.epoch };
  const key = JSON.stringify(full);
  if (!ui.retries.has(key)) {
    if (ui.retries.size >= 24) ui.retries.delete(ui.retries.keys().next().value);
    ui.retries.set(key,randomId(16));
  }
  const result = await api('save',{ ...full,request:ui.retries.get(key) });
  ui.retries.delete(key);
  return result;
}

function toast(message,tone = '',link = '') {
  const node = document.createElement('div');
  node.className = 'toast ' + tone;
  node.innerHTML = `${actionIcon(tone ? 'alert' : 'check')}<div>${escape(message)}${link}</div>`;
  $('#toast-area').append(node);
  setTimeout(() => node.remove(),link ? 14000 : tone ? 9500 : 5600);
}

async function work(control,label,callback,inDialog = false) {
  if (ui.busy) return;
  ui.busy = true;
  const original = control?.innerHTML;
  if (control) {
    control.disabled = true;
    control.setAttribute('aria-busy','true');
    control.classList.add('is-loading');
    control.textContent = label;
  }
  if (inDialog) errorInDialog('');
  try { await callback(); } catch (error) {
    if (error.code === 'SESSION') {
      remember('');
      ui.retries.clear();
      closeModal();
      data = null;
      ui.choose = false;
      render();
      toast(error.message,'warn');
    } else if (inDialog && dialog.open) errorInDialog(error.message);
    else toast(error.message,'error');
  } finally {
    ui.busy = false;
    if (control?.isConnected) {
      control.disabled = false;
      control.removeAttribute('aria-busy');
      control.classList.remove('is-loading');
      control.innerHTML = original;
    }
  }
}

function afterSave(result) {
  data = result;
  closeModal();
  render();
  if (result.message) toast(result.message);
  if (result.warning) toast(result.warning,'warn');
}

async function download(name) {
  const file = await api('export',{name});
  const bytes = Uint8Array.from(atob(file.base64), character => character.charCodeAt(0));
  const url = URL.createObjectURL(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = file.name;
  link.target = '_self';
  document.body.append(link);
  link.click();
  link.remove();
  toast('Archivo Excel listo.','',`<br><a class="report-link" href="${url}" download="${escape(file.name)}" target="_self">Descargar de nuevo</a>`);
  setTimeout(() => URL.revokeObjectURL(url),120000);
}

document.addEventListener('submit',event => {
  if (event.target.id !== 'dialog-form') return;
  event.preventDefault();
  const form = event.target;
  const options = ui.modal;
  if (!options?.kind || ui.busy) return;
  const kind = options.kind;
  const values = Object.fromEntries(new FormData(form));
  let payload = { kind,...values };
  if (kind === 'reset') payload = {kind};
  if (kind === 'product') Object.assign(payload,{id:options.id,active:values.active === 'yes'});
  if (kind === 'place') Object.assign(payload,{id:options.id,parent:options.parent,level:options.level});
  if (kind === 'sale') payload = {kind,person:values.person,notes:values.notes,lines:ui.cart.map(row => ({...row}))};
  work($('button[type=submit]',form),'Guardando…',async () => {
    const result = await submitOperation(payload);
    if (kind === 'reset') {
      ui.filters = {};
      ui.page = 'dashboard';
      ui.dates = {};
      ui.range = 'today';
      ui.retries.clear();
    }
    afterSave(result);
  },true);
});

document.addEventListener('input',event => {
  const target = event.target;
  if (target.matches('input[data-filter]')) {
    getFilter()[target.name] = target.value;
    renderResults();
  }
  if (target.matches('[data-find-product]')) {
    const form = target.form;
    const p = form.elements.product;
    selectUpdate(p,productOptions(ui.modal.kind,target.value),p.value);
    productChanged(form);
  }
});

document.addEventListener('change',event => {
  const target = event.target;
  if (target.matches('[data-filter]')) {
    getFilter()[target.name] = target.value;
    renderResults();
  }
  if (target.matches('[data-period]')) {
    ui.dates[target.name] = target.value;
    $('#main').innerHTML = dashboard();
  }
  if (target.matches('[data-product]')) productChanged(target.form);
  if (target.matches('[data-route]')) routeUpdate(target.form,target.dataset.route);
});

function productChanged(form) {
  if (ui.modal.kind === 'sale') saleLocations(form);
  else routeUpdate(form,'from',bestLocation(form.elements.product.value));
}

dialog.addEventListener('cancel',event => {
  event.preventDefault();
  if (!ui.busy) closeModal();
});

document.addEventListener('click',event => {
  const control = event.target.closest('[data-action]');
  if (!control || ui.busy) return;
  const {action,value} = control.dataset;
  if (action === 'start') {
    work(control,'Abriendo demo…',async () => {
      if (!/^[a-f0-9]{64}$/.test(token)) remember(randomId(32));
      try { data = await api('open'); } catch (error) {
        if (error.code !== 'SESSION') throw error;
        remember(randomId(32));
        data = await api('open');
      }
      ui.page = 'dashboard';
      ui.choose = false;
      render();
    });
  } else if (action === 'mode') {
    work(control,'Cargando modalidad…',async () => {
      data = await submitOperation({kind:'mode',mode:value});
      ui.choose = false;
      goto('dashboard');
    });
  } else if (action === 'refresh') {
    work(control,'Actualizando…',async () => {
      data = await api('state');
      if (ui.page === 'sales' && data.mode !== 'ventas') ui.page = 'dashboard';
      render();
      toast('Sesión actualizada.');
    });
  } else if (action === 'export') work(control,'Generando Excel…',() => download(value));
  else if (action === 'choose' || action === 'choose-back') {
    ui.choose = action === 'choose';
    ui.nav = false;
    render();
    window.scrollTo(0,0);
  } else if (action === 'nav-toggle') {
    ui.nav = !ui.nav;
    $('.sidebar').classList.toggle('open',ui.nav);
    $('.overlay').classList.toggle('open',ui.nav);
    $('.mobile-nav').setAttribute('aria-expanded',ui.nav);
  } else if (action === 'nav') goto(value);
  else if (action === 'alert-filter') goto('alerts',{state:value});
  else if (action === 'loc-stock') goto('stock',{loc:value});
  else if (action === 'clear') { ui.filters[ui.page] = {}; $('#main').innerHTML = pageContent(); }
  else if (action === 'period') { ui.range = value; $('#main').innerHTML = dashboard(); }
  else if (action === 'modal-close') closeModal();
  else if (action === 'product-edit') productForm(value);
  else if (action === 'product-view') productView(value);
  else if (action === 'move-view') moveView(value);
  else if (action === 'sale-view') saleView(value);
  else if (action === 'place-new' || action === 'place-edit') {
    const [level,related] = value.split('|');
    placeForm(level,action === 'place-edit' ? related : '',action === 'place-new' ? related : '');
  } else if (action === 'form') {
    if (value === 'product') productForm('');
    else if (value === 'sale') saleForm();
    else movementForm(value);
  } else if (action === 'cart-add') cartAdd();
  else if (action === 'cart-remove') {
    ui.cart.splice(Number(value),1);
    errorInDialog('');
    drawCart();
  } else if (action === 'reset') {
    if (!data.resets) {
      toast('Alcanzaste el límite de reinicios de esta sesión.','warn');
      return;
    }
    modal('Reiniciar mi demo','El reinicio se aplica a tu sesión de prueba.',`<p class="notice warn">Se borrarán tus productos nuevos y movimientos de prueba. Se restaurarán el catálogo y las existencias originales.</p><p class="caption">Reinicios disponibles · ${data.resets}</p>`,
      {kind:'reset',label:'REINICIAR MI DEMO'});
  }
});

render();

})();
</script>
</body>
</html>
